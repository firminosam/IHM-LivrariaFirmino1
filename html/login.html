<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" />
    <link rel="stylesheet" href="../css/login.css">
    <title>Login - Livraria</title>
</head>
<body>

<main class="login">
    <div class="login-box">

        <h2>Login</h2>

        <form id="loginForm" novalidate>

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite o seu e-mail" required>
            <span class="error-msg" id="emailError"></span>

            <label for="password">Palavra-passe</label>
            <input type="password" id="password" placeholder="Digite a sua senha" required>
            <span class="error-msg" id="passwordError"></span>

            <button type="submit">Entrar</button>

        </form>

        <div class="login-links">
            <a href="#">Esqueceu a senha?</a>
            <p>Não tem conta? <a href="Cadastro.html">Criar conta</a></p>
        </div>

    </div>
</main>

<script src="../js/main.js"></script>
</body>
</html>
